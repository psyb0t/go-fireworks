package: fireworks
generate:
  models: true
output: types.gen.go
output-options:
  resolve-type-name-collisions: true
  # The spec files GetApiKey and UpdateApiKey under a malformed path that
  # repeats {account_id} and {user_id} and has no {keyId} segment for the key
  # ID parameter, so oapi-codegen rejects it and the real URL is unknown.
  # Remove the exclusion once the spec fixes the path.
  exclude-operation-ids:
    - Gateway_GetApiKey
    - Gateway_UpdateApiKey
  # Keep in sync with config.yaml: the client half references these types.
  type-mapping:
    number:
      default:
        type: float64
compatibility:
  always-prefix-enum-values: true
